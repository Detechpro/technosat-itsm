services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false   # Portainer sets variables in its UI instead
    depends_on: [db]
    environment:
      # Web calls the API by its service name, so Django must accept that host.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-portal.example.com},api
    volumes: [media:/app/media]
    command: sh -c "python manage.py migrate --noinput && gunicorn itsm.wsgi:application --bind 0.0.0.0:${API_PORT:-8000} --workers 3"
    expose: ["${API_PORT:-8000}"]
    restart: unless-stopped

  worker:
    # Replaces Celery: retries webhooks and emits overdue events on a loop.
    build: .
    env_file:
      - path: .env
        required: false   # Portainer sets variables in its UI instead
    depends_on: [api]
    command: sh -c "while true; do python manage.py retry_webhooks; python manage.py check_overdue; sleep 60; done"
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:${API_PORT:-8000}
      PUBLIC_URL: ${PUBLIC_URL:-https://portal.example.com}
      PORT: ${WEB_PORT:-3000}   # set WEB_PORT in Portainer to change the port
    depends_on: [api]
    expose: ["${WEB_PORT:-3000}"]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.example.com}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.example.com/}
      PORTAL_OUTBOUND_SECRET: ${N8N_WEBHOOK_SECRET}
      PORTAL_INBOUND_SECRET: ${N8N_INBOUND_SECRET}
      PORTAL_BASE_URL: ${N8N_PORTAL_URL:-http://api:8000}   # internal network: n8n never needs the public API
      PORTAL_APPROVER_EMAIL: ${PORTAL_APPROVER_EMAIL:-}
      PORTAL_FROM_EMAIL: ${SMTP_FROM}
    volumes: [n8ndata:/home/node/.n8n]
    expose: ["5678"]
    restart: unless-stopped

  # Reverse proxy: point your existing Nginx/Portainer at these:
  #   portal.example.com  -> web:3000   (Next.js UI; it calls api internally)
  #   api.example.com     -> api:8000   (mobile apps and integrations)
  #   n8n.example.com     -> n8n:5678

volumes:
  pgdata:
  media:
  n8ndata:
