{% extends "base.html" %}
{% block content %}<div class="auth"><div class="card"><h1>Choose a new password</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Set password</button></form>
{% else %}<p class="muted">This reset link is invalid or has already been used. Request a new one.</p>{% endif %}</div></div>{% endblock %}
