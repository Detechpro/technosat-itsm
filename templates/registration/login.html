{% extends "base.html" %}
{% block content %}
<div class="auth"><div class="card"><h1>Sign in</h1>
<form method="post">{% csrf_token %}
{% if form.errors %}<div class="msg msg-error">Username or password is incorrect.</div>{% endif %}
<label>Email</label>{{ form.username }}
<label>Password</label>{{ form.password }}
<p><button class="btn btn-primary" type="submit" style="width:100%">Sign in</button></p>
<input type="hidden" name="next" value="{{ next }}">
</form>
<p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
</div></div>
{% endblock %}
