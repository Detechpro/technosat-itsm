<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ heading }}</title></head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Calibri,'Nunito Sans',Arial,sans-serif;color:#1d2433;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#ffffff;padding:22px 28px 16px;border-bottom:4px solid #1b6cb0;"><img src="cid:{{ logo_cid }}" alt="Technosat" width="200" style="display:block;width:200px;height:auto;border:0;"></td></tr>
        <tr><td style="padding:28px;">
          <h1 style="margin:0 0 16px;font-size:20px;color:#13324f;">{{ heading }}</h1>
          {% if greeting %}<p style="margin:0 0 14px;font-size:15px;">{{ greeting }}</p>{% endif %}
          {% for p in paragraphs %}<p style="margin:0 0 14px;font-size:15px;line-height:1.6;">{{ p }}</p>{% endfor %}
          {% if button %}
          <p style="margin:22px 0 0;"><a href="{{ button.1 }}" style="display:inline-block;background:#1b6cb0;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:8px;">{{ button.0 }}</a></p>
          {% endif %}
        </td></tr>
        <tr><td style="background:#f5f7fb;padding:16px 28px;font-size:12px;color:#6b6f76;">
          IT Support Technosat · This mailbox is not monitored, please do not reply.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
